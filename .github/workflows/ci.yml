name: CI

on:
  push:
  pull_request:

# The embedded Dolt driver dictates two build settings, so they are set
# once here rather than repeated on every `go` invocation (which also keeps
# the commands in CLAUDE.md and in this workflow identical):
#
#   CGO_ENABLED  dolt's block store imports github.com/dolthub/gozstd, a
#                cgo wrapper around zstd, unconditionally.
#   gms_pure_go  swaps go-mysql-server's ICU-backed REGEXP implementation
#                for the standard library's. Without it the build needs
#                system ICU development headers, which are not present on
#                the Windows and macOS runner images.
env:
  CGO_ENABLED: "1"
  GOFLAGS: -tags=gms_pure_go

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check gofmt formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go test
        run: go test ./...

  # A separate lane rather than a fourth entry in the matrix above: the race
  # detector needs cgo (set workflow-wide) and an x86-64 host, so it runs on
  # ubuntu-latest only.
  race:
    name: Test (race)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go test -race
        run: go test -race ./...
