name: CI

on:
  push:
  pull_request:

# The embedded Dolt driver dictates two build settings, so they are set
# once here rather than repeated on every `go` invocation (which also keeps
# the commands in CLAUDE.md and in this workflow identical):
#
#   CGO_ENABLED  dolt's block store imports github.com/dolthub/gozstd, a
#                cgo wrapper around zstd, unconditionally.
#   gms_pure_go  swaps go-mysql-server's ICU-backed REGEXP implementation
#                for the standard library's. Without it the build needs
#                system ICU development headers, which are not present on
#                the Windows and macOS runner images.
env:
  CGO_ENABLED: "1"
  GOFLAGS: -tags=gms_pure_go

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check gofmt formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache checksum-pinned inference artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v4
        with:
          path: ~/.memdolt/models
          key: ${{ runner.os }}-${{ runner.arch }}-memdolt-inference-${{ hashFiles('models/manifest.json') }}

      - name: go test
        run: go test ./...

      - name: Golden retrieval gate
        if: matrix.os == 'ubuntu-latest'
        run: go test -tags golden,gms_pure_go ./tests/golden/... -v -timeout 30m -run TestRetrievalGolden

      - name: Golden locator gate
        if: matrix.os == 'ubuntu-latest'
        run: go test -tags golden,gms_pure_go ./tests/golden/... -run TestLocateGolden -count=1 -timeout 30m

  # A separate lane rather than a fourth entry in the matrix above: a new
  # matrix dimension would re-render the protected status-check names the test
  # job produces (`Test (ubuntu-latest)` etc.) and silently break branch
  # protection. The race detector needs only cgo, which is set workflow-wide;
  # it supports every OS in the matrix.
  race:
    name: Test (race)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go test -race
        run: go test -race ./...

  hub:
    name: Test (hub ingress)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build disposable namespace test image
        run: docker build -t memdolt-hub-test tests/hub

      - name: Verify pinned native Dolt release before execution
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/dolthub/dolt/releases/download/v1.88.1/dolt-linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/dolt-linux-amd64.tar.gz"
          # Published digest from the official release asset API, verified 2026-09-07:
          # https://api.github.com/repos/dolthub/dolt/releases/tags/v1.88.1
          printf '%s  %s\n' 26eccddbd0d7a0da6bc2a5bc6fd2adc2033a8c54d2b56d7204297a310321736e \
            "$RUNNER_TEMP/dolt-linux-amd64.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/dolt-linux-amd64.tar.gz" -C "$RUNNER_TEMP"

      - name: Build hub CLI
        run: go build -o "$RUNNER_TEMP/hub-memdolt" ./cmd/memdolt

      - name: Verify generated deployment and isolated private ingress
        run: |
          docker run --rm --privileged --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/src,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/hub-memdolt,target=/inputs/memdolt,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/dolt-linux-amd64/bin/dolt,target=/inputs/dolt,readonly" \
            memdolt-hub-test python3 /src/tests/hub/verify_linux.py \
            --memdolt /inputs/memdolt --dolt /inputs/dolt --uid 1001
