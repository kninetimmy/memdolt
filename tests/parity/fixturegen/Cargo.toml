[package]
name = "fixturegen"
version = "0.1.0"
edition = "2021"
publish = false
description = "M0 rig-2 (PRD §16) reference-fixture generator. Loads memhub's exact SHA-256-pinned model files through fastembed 5 and writes token ids, embeddings, and rerank scores for tests/parity/testdata/corpus.json to tests/parity/testdata/*.json. Never built by `go build`/`go test`; run manually with `cargo run`."

[dependencies]
# Pinned to the exact version memhub's Cargo.lock resolves fastembed 5 to
# (github.com/kninetimmy/memhub, Cargo.lock, 2026-07-30), so the reference
# fixtures are generated by the same code path memhub ships.
fastembed = { version = "=5.13.4", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
